name: velora
description: Velora Strategic OS
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.6
  
  # State Management
  flutter_riverpod: ^2.5.1
  
  # Navigation
  go_router: ^13.2.0
  
  # Localization
  easy_localization: ^3.0.7
  
  # Backend
  supabase_flutter: ^2.5.0
  
  # UI & Design System
  google_fonts: ^6.2.1
  fl_chart: ^0.68.0                # 🎯 Charts & Graphs for Analytics
  flutter_markdown: ^0.7.3         # 📝 Markdown rendering for Notes
  
  # Utils
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  url_launcher: ^6.2.5             # 🔗 Open links (About section)

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/translations/