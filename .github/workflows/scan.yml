name: 🚀 Velora Auto-Scan

on:
  schedule:
    # كل 3 ساعات — والمنطق داخل الكود يقرر من يُمسح حسب خطة كل مستخدم
    # (Free: كل 24h، Pro: كل 6h، Pro Plus: كل 3h، Enterprise: كل 1h)
    - cron: '0 */3 * * *'
  workflow_dispatch:  # تشغيل يدوي من GitHub
  
jobs:
  scan-all:
    runs-on: ubuntu-latest
    
    steps:
      - name: 📥 Checkout code
        uses: actions/checkout@v4
      
      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      
      - name: 📦 Install dependencies
        working-directory: ./scrapers
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      
      - name: 🔐 Setup environment
        working-directory: ./scrapers
        run: |
          echo "SUPABASE_URL=${{ secrets.SUPABASE_URL }}" > .env
          echo "SUPABASE_SERVICE_ROLE_KEY=${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}" >> .env
          echo "HF_API_KEY=${{ secrets.HF_API_KEY }}" >> .env
          echo "USE_LOCAL_OLLAMA=false" >> .env
          echo "SCAN_INTERVAL=86400" >> .env
          echo "MAX_RETRIES=3" >> .env
      
      - name: 🚀 Run scan (Tier-Aware)
        working-directory: ./scrapers
        run: python main.py
      
      - name: 📤 Upload logs (if failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: scan-logs
          path: scrapers/scraper.log