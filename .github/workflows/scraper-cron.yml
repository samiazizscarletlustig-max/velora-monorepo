name: Velora Scraper Cron Job

on:
  schedule:
    - cron: '0 */6 * * *' # تشغيل كل 6 ساعات تلقائياً
  workflow_dispatch:      # للسماح بالتشغيل اليدوي للاختبار

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    steps:
      # 1. جلب الكود من المستودع
      - name: Checkout code
        uses: actions/checkout@v3

      # 2. إعداد بيئة بايثون
      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      # 3. تثبيت المكتبات المطلوبة
      # ✅ المسار الصحيح هو ./scrapers كما ظهر في المجلدات
      - name: Install dependencies
        working-directory: ./scrapers
        run: pip install -r requirements.txt

      # 4. تشغيل السكربت الرئيسي
      # ✅ نفس المسار هنا لضمان العثور على main.py
      - name: Run Scraper
        working-directory: ./scrapers
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python main.py