name: Velora Scraper Cron Job

on:
  schedule:
    - cron: '0 */6 * * *' # تشغيل كل 6 ساعات
  workflow_dispatch:      # للسماح بالتشغيل اليدوي

jobs:
  run-scraper:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        working-directory: ./apps/scraper  # ✅ تأكد أن هذا المسار صحيح لمجلدك
        run: pip install -r requirements.txt

      - name: Run Scraper
        working-directory: ./apps/scraper  # ✅ نفس المسار هنا أيضاً
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: python main.py